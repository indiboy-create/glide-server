# nginx 配置示例：缩略图自动生成系统
#
# 用法：把下面 server{} 内的相关段合并进你的站点配置，
# 或整站替换后修改 root / server_name / fastcgi_pass 三处。

server {
    listen 80;
    server_name example.com;

    # 网站根目录（本系统 composer create-project 后的目录）
    root /var/www/site;
    index index.php index.html;

    # ========== 核心：/uploads/ 下的图片请求全部交给 thumb.php ==========
    #   带缩放参数  -> 生成/命中缩略图缓存后返回
    #   不带参数    -> 直接返回原图
    #   请求 URL 不变：<img src="/uploads/news/111.jpg?w=300&h=400&fit=cover">
    location ~* ^/uploads/.+\.(jpg|jpeg|png|gif|webp)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/thumb.php;
        fastcgi_param REQUEST_URI    $request_uri;
        fastcgi_pass 127.0.0.1:9000;   # 按实际情况改为 unix:/run/php/php8.2-fpm.sock
    }

    # 禁止外部直接访问缩略图缓存目录
    location ^~ /cache/ {
        deny all;
    }

    # 禁止外部访问系统内部目录（vendor / src / config / bin）
    location ~* ^/(vendor|src|config|bin)/ {
        deny all;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 常规 PHP 请求
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # 静态资源（除 /uploads 之外的）直接由 nginx 返回
    location ~* \.(css|js|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
